<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Console</title>
<link rel="stylesheet" href="style.css?v=9">
<link rel="stylesheet" href="hotfix091.css?v=091">
<link rel="stylesheet" href="world-v010.css?v=011">
</head>
<body>
<div id="static" aria-hidden="true"></div>
<div id="signalField" aria-hidden="true">
  <svg viewBox="0 0 1000 1000" class="observer back"><circle cx="500" cy="500" r="332"/><path d="M500 112 850 720H150Z"/><path d="M250 510Q500 300 750 510Q500 720 250 510Z"/><circle cx="500" cy="510" r="86"/><circle cx="500" cy="510" r="16"/></svg>
  <svg viewBox="0 0 1000 1000" class="observer front"><circle cx="500" cy="500" r="332"/><path d="M500 112 850 720H150Z"/><path d="M250 510Q500 300 750 510Q500 720 250 510Z"/><circle cx="500" cy="510" r="86"/><circle cx="500" cy="510" r="16"/></svg>
</div>
<header id="ticker">
  <span class="liveDot"></span>
  <div id="tickerWindow"><div id="tickerTrack"></div>
  </div>
  <button id="attentionPull" class="topControl">PULL</button>
</header>
<main id="viewport">
  <div id="workspace"></div>
  <div id="relationshipLayer" aria-hidden="true"><svg id="links"></svg></div>
  <div id="focusDim"></div>
  <div id="dropHint"><div>DROP ANYTHING</div><small>files · links · text · media</small></div>
  <section id="metaScene" aria-label="Display interface">
    <div class="metaCore" id="metaCore">
      <div class="metaRing r1"></div><div class="metaRing r2"></div><div class="metaEye"></div>
      <svg viewBox="0 0 400 400" class="metaGlyph back"><circle cx="200" cy="200" r="142"/><path d="M200 34 350 294H50Z"/><path d="M88 205Q200 108 312 205Q200 302 88 205Z"/><circle cx="200" cy="205" r="38"/></svg>
      <svg viewBox="0 0 400 400" class="metaGlyph front"><circle cx="200" cy="200" r="142"/><path d="M200 34 350 294H50Z"/><path d="M88 205Q200 108 312 205Q200 302 88 205Z"/><circle cx="200" cy="205" r="38"/></svg>
    </div>
    <div id="metaNodes"></div>
    <div id="metaReadout"><div id="metaType"></div><div id="metaTitle"></div><div id="metaState"></div></div>
    <div id="metaHint">← → SELECT · ↑ OPEN · ↓ BACK</div>
    <div id="metaPanel"><div id="metaPanelShell"><div id="metaPanelType"></div><h2 id="metaPanelTitle"></h2><div id="metaPanelRows"></div><div class="metaActions"><button id="metaShape">□ / ○</button><button id="metaClose">BACK</button></div></div></div>
  </section>
</main>
<footer id="dock">
  <button id="addObject" class="dockBtn primary">＋ OPEN</button>
  <button id="restoreAll" class="dockBtn">OBJECTS</button>
  <div id="objectBay"></div>
  <input id="command" autocomplete="off" spellcheck="false" placeholder="ask · open · play · show · find · resume…">
  <button id="assistantButton" class="dockBtn">CHAT</button>
  <button id="displayMode" class="dockBtn">DISPLAY</button>
</footer>
<div id="launcher" class="overlay" aria-hidden="true">
  <div class="launcherShell">
    <div class="launcherHead"><span>OPEN OBJECT</span><button data-close="launcher">×</button></div>
    <div class="launcherGrid">
      <button data-spawn="file"><b>FILE</b><small>PDF · image · video · audio · text</small></button>
      <button data-spawn="url"><b>URL</b><small>web · Google · YouTube · Vimeo</small></button>
      <button data-spawn="note"><b>NOTE</b><small>freeform object</small></button>
      <button data-spawn="chat"><b>CHATGPT</b><small>assistant surface / bridge</small></button>
      <button data-spawn="browser"><b>BROWSER</b><small>open a live web surface</small></button>
      <button data-spawn="terminal"><b>TERMINAL</b><small>machine bridge surface</small></button>
    </div>
    <div class="launcherInput"><input id="urlInput" placeholder="Paste a URL and press Enter"><button id="openUrl">OPEN</button></div>
    <div class="privacyNote">CLOUD OBJECTS FOLLOW YOU. LOCAL BINARY FILES REMAIN TRANSIENT UNTIL PRIVATE STORAGE PROMOTION IS ENABLED.</div>
  </div>
</div>
<input id="filePicker" type="file" hidden multiple accept="*/*">
<div id="toast"></div>
<script src="compat091.js?v=091"></script>
<script src="data.js?v=091"></script>
<script src="core.js?v=091"></script>
<script src="meta.js?v=091"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="supabase-config.js?v=011"></script>
<script src="world-v011.js?v=011"></script>
<script src="world-meta-v011.js?v=011"></script>
</body>
</html>
